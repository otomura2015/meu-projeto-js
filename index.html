<!DOCTYPE html>
<html>

<head>
    <title>Meu site</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #202030;
            font-family: Arial, sans-serif;
        }

        .div1 {
            width: 500px;
            padding: 40px;

            background: lightsalmon;
            color: #252525;

            border-radius: 25px;
            box-shadow: 10px 10px 30px #111;

            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 35px;
        }

        input {
            width: 80%;
            padding: 15px;

            border: none;
            border-radius: 12px;

            font-size: 20px;
            outline: none;
        }

        button {
            margin-top: 15px;
            padding: 15px 30px;

            border: none;
            border-radius: 12px;

            background: #ff7043;
            color: white;

            font-size: 20px;
            cursor: pointer;
        }

        .botao {
            margin-top: 15px;
            padding: 15px 30px;

            border: none;
            border-radius: 12px;

            background-color: #ff7043;
            color: white;

            font-size: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #e85d32;
        }

        #resultado {
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="div1">

        <h1>Coloque seu nome</h1>

        <input id="nome">

        <br>

        <button onclick="mostrar()">Mostrar</button>

        <p id="resultado"></p>

        <a href="pagina2.html" class="botao">Proxima pagina</a>

    </div>

    <script src="script.js"></script>

</body>

</html>
